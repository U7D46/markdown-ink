name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: |
          mkdir -p build-logs
          gradle assembleRelease --stacktrace 2>&1 | tee build-logs/release.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InkPad-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build Debug APK (fallback)
        if: failure()
        run: |
          mkdir -p build-logs
          gradle assembleDebug --stacktrace 2>&1 | tee build-logs/debug.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Debug APK artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: InkPad-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/*.log
          retention-days: 7
